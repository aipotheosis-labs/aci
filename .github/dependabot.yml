# Dependabot version-update configuration.
# NOTE: Dependabot *security* updates (CVE-driven PRs) are raised immediately
# regardless of these schedules; the intervals below only control proactive
# version bumps.
version: 2

updates:
  # GitHub Actions used by CI workflows (.github/workflows/*)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Group all action bumps into a single PR to reduce noise
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # Backend Python dependencies (uv.lock + pyproject.toml)
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "monthly"
    # Group minor/patch bumps; majors arrive as individual PRs for review
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  # Frontend dependencies (package-lock.json)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    # Group minor/patch bumps; majors arrive as individual PRs for review
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  # Backend Docker base images (Dockerfile.*), pinned by digest
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    ignore:
      # Stay on Python 3.12 (matches backend/.python-version); digest refreshes still apply
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # Backend Compose service images (compose.yml), pinned by digest
  - package-ecosystem: "docker-compose"
    directory: "/backend"
    schedule:
      interval: "monthly"
    ignore:
      # LocalStack >= 2026.03 requires an auth token; stay on 4.x
      - dependency-name: "localstack/localstack"
        update-types: ["version-update:semver-major"]
    groups:
      docker-compose:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

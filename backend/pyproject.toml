[project]
name = "aci"
version = "0.0.1-beta.3"
description = "agent computer interface by aipolabs"
authors = [{ name = "Aipolabs", email = "support@aipolabs.xyz" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.12",
    "uvicorn[standard]>=0.31.1",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.0.40,<2.1",
    "pgvector>=0.5.1",
    "authlib>=1.6.11,<1.8",
    "psycopg[binary]>=3.3.6",
    "httpx>=0.27.2",
    "itsdangerous>=2.2.0",
    "openai>=1.80.0",
    "click>=8.1.8",
    "openapi-spec-validator>=0.9.0",
    "jsonschema>=4.23.0",
    "limits>=5.8.0",
    "aws-cdk-lib>=2.274.0",
    "constructs>=10.4.2",
    "jinja2>=3.1.6",
    "deepdiff>=8.6.2",
    "python-json-logger>=3.3.0",
    "logfire[fastapi,sqlalchemy]>=3.16.0,<5",
    "sentry-sdk[fastapi]>=2.26.1",
    "google-api-python-client>=2.201.0",
    "aws-encryption-sdk[mpl]>=4.0.1",
    "boto3>=1.43.115",
    "rich>=13.9.4",
    "propelauth-fastapi>=4.4.0",
    "svix>=1.65.0",
    "stripe>=12.1.0",
    "e2b-code-interpreter>=1.5.0",
    "browser-use>=0.5.0",
    "langchain-openai>=1.7.2",
    "elevenlabs>=2.74.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-subtests>=0.15.0",
    "mypy>=1.15.0",
    "alembic>=1.20.0",
    "ruff==0.17.1",
    "pre-commit>=4.7.0",
    "responses>=0.26.3",
    "respx>=0.23.1",
    "types-jsonschema>=4.26.0.20261006",
    "google-api-python-client-stubs>=1.40.0",

    # eval dependencies
    "datasets>=5.1.0",
    "huggingface-hub>=0.31.2",
    "pandas>=2.2.3",
    "pandas-stubs>=2.2.3.250308",
    "tenacity>=8.2.3",
    "tqdm>=4.70.1",
    "types-tqdm>=4.70.0.20260906",
    "wandb>=0.31.0",
]


[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "venv", "build", "dist", "aci/alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
    "C4",  # flake8-comprehensions
]

# N501 is line to long error, we current have 200 comments that are longer than 100
# characters, need to fix them gradually. Ignoring this error for now.
# UP046 (PEP 695 generic syntax, added in ruff 0.12) would require refactoring the
# function executors' shared TypeVars; keep classic Generic[...] for now.
ignore = ["W", "D", "ERA001", "N806", "E501", "N805", "RUF012", "UP046"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
# Keep import-not-found errors
ignore_missing_imports = false
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true

# Ignore missing type stubs for specific modules
[[tool.mypy.overrides]]
module = "pgvector.sqlalchemy"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "authlib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "requests"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "browser_use.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "propelauth_fastapi"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "propelauth_py.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "e2b_code_interpreter"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "huggingface_hub.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "datasets.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
